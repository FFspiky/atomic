name: Validate atomic filename handling
on:
  push:
    branches: [validation/long-destination-basename]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        go: ['1.12.17', '1.25.5']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go version
      - run: go test -race -cover -v -count=1 ./...
      - run: go build ./...
      - run: python .github/compare-vet.py
